[build]
  publish = "."

# Single-file PWA: every path falls back to index.html so deep links and
# refreshes on any in-app "route" still load the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker file itself must NEVER be cached by the CDN/browser —
# otherwise a deploy's update-toast mechanism can't reach clients because
# they keep fetching a stale sw.js. index.html is also kept no-cache so a
# fresh deploy is picked up on next navigation (the SW's own networkFirst
# strategy handles the offline fallback).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icon-192.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon-512.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
